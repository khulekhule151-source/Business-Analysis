<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BUSINESS ANALYSIS — Owner Control Center</title><style>body{margin:0;font-family:Arial;background:#0b0f14;color:#f4f7fb}.wrap{max-width:1050px;margin:40px auto;padding:20px}.panel{background:#111820;border-radius:16px;padding:24px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#17212b;border-radius:12px;padding:18px}.muted{color:#9aa7b4}input,button{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border-radius:8px;border:1px solid #34404c}button{background:#3b82f6;color:white;border:0;cursor:pointer}#app{display:none}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><div class="panel" id="login"><h1>BUSINESS ANALYSIS</h1><p class="muted">Owner Control Center</p><input id="u" placeholder="Owner username"><input id="p" type="password" placeholder="Password"><button onclick="login()">Sign in</button><p id="msg" class="muted"></p></div><div id="app"><div class="panel"><h1>Owner Control Center</h1><p class="muted">BUSINESS ANALYSIS v2.0.0</p><button onclick="loadSummary()">Refresh Metrics</button></div><div class="grid"><div class="card"><div class="muted">Total Installations</div><h2 id="inst">—</h2></div><div class="card"><div class="muted">Active Users (30d)</div><h2 id="active">—</h2></div><div class="card"><div class="muted">Telemetry Events</div><h2 id="events">—</h2></div><div class="card"><div class="muted">Last Seen</div><h2 id="last">—</h2></div></div></div></div><script>const API='https://business-analysis-api-I8nm.onrender.com';let token='';async function login(){msg.textContent='Signing in...';try{let r=await fetch(API+'/api/owner/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});let d=await r.json();if(!r.ok)throw Error(d.detail||'Login failed');token=d.token;document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';loadSummary()}catch(e){msg.textContent=e.message}}async function loadSummary(){try{let r=await fetch(API+'/api/owner/summary',{headers:{Authorization:'Bearer '+token}});let d=await r.json();if(!r.ok)throw Error(d.detail||'Unable to load metrics');inst.textContent=d.total_installations??0;active.textContent=d.active_users??0;events.textContent=d.telemetry_events??0;last.textContent=d.last_seen?new Date(d.last_seen).toLocaleString():'Never'}catch(e){alert(e.message)}}</script></body></html>
