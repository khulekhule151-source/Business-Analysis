services:
  - type: web
    name: business-analysis-api
    runtime: python
    rootDir: Backend
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BUSINESS_ANALYSIS_OWNER_USERNAME
        sync: false
      - key: BUSINESS_ANALYSIS_OWNER_PASSWORD
        sync: false
      - key: BUSINESS_ANALYSIS_TELEMETRY_KEY
        sync: false
      - key: BUSINESS_ANALYSIS_TOKEN_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
