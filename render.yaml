services:
  - type: web
    name: business-analysis-api
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r Backend/requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BUSINESS_ANALYSIS_OWNER_USERNAME
        sync: false
      - key: BUSINESS_ANALYSIS_OWNER_PASSWORD
        sync: false
      - key: BUSINESS_ANALYSIS_TELEMETRY_KEY
        sync: false
      - key: BUSINESS_ANALYSIS_TOKEN_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: business-analysis-db
          property: connectionString

databases:
  - name: business-analysis-db
    plan: free
