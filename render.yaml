databases:
  - name: business-analysis-v3-db
    databaseName: business_analysis_v3
    user: business_analysis_v3

services:
  - type: web
    name: business-analysis-v3-api
    runtime: python
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: business-analysis-v3-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false

  - type: web
    name: business-analysis-v3-website
    runtime: static
    rootDir: Website
    buildCommand: echo "Static site ready"
    staticPublishPath: .
